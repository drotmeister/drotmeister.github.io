<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      font-size: 16px;
      color: #222;
    }

    /* Faixa única cinza escuro (quase preto) cobrindo nome e seções */
    header {
      background-color: #222222;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px 20px;
      margin-bottom: 40px;
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #ffffff;
      border-bottom: none !important;
    }

    /* Links das seções dentro da mesma faixa escura */
    .nav-bar a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 18px;
      display: inline-block;
      font-size: 1.05em;
      font-weight: normal !important;
      border-bottom: none !important;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Conteúdo principal mantido em 800px centralizado */
    main {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    main a {
      color: #8b0000;
      text-decoration: none;
    }

    main a:hover {
      text-decoration: underline;
    }

    h1, h2 {
      border-bottom: none !important;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>
<body>

  <header>
    <h1>Daniel Rotmeister</h1>
    <div class="nav-bar">
      {% include nav.html %}
    </div>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
