<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      font-size: 16px;
      color: #222;
    }

    /* Faixa única cinza escuro (quase preto) cobrindo nome e seções */
    header {
      position: relative;
      background-color: #222222;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px 20px;
      margin-bottom: 40px;
    }

    /* Diagrama de Dynkin Dn no canto esquerdo da faixa */
    .dynkin-dn {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.9;
    }

    /* Esconde no celular para não sobrepor o nome */
    @media (max-width: 750px) {
      .dynkin-dn {
        display: none;
      }
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #ffffff;
      border-bottom: none !important;
    }

    /* Links das seções dentro da mesma faixa escura */
    .nav-bar a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 18px;
      display: inline-block;
      font-size: 1.05em;
      font-weight: normal !important;
      border-bottom: none !important;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Conteúdo principal mantido em 800px centralizado */
    main {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    main a {
      color: #8b0000;
      text-decoration: none;
    }

    main a:hover {
      text-decoration: underline;
    }

    h1, h2 {
      border-bottom: none !important;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>
<body>

  <header>
    <svg class="dynkin-dn" width="135" height="50" viewBox="0 0 150 56" xmlns="http://www.w3.org/2000/svg" aria-label="Dynkin diagram Dn">
      <!-- Nós -->
      <circle cx="14" cy="28" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="50" cy="28" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="102" cy="28" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="134" cy="10" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="134" cy="46" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>

      <!-- Arestas -->
      <line x1="19" y1="28" x2="45" y2="28" stroke="#ffffff" stroke-width="2"/>
      <line x1="106.35" y1="25.55" x2="129.65" y2="12.45" stroke="#ffffff" stroke-width="2"/>
      <line x1="106.35" y1="30.45" x2="129.65" y2="43.55" stroke="#ffffff" stroke-width="2"/>

      <!-- Reticências (...) -->
      <circle cx="66" cy="28" r="1.7" fill="#ffffff"/>
      <circle cx="76" cy="28" r="1.7" fill="#ffffff"/>
      <circle cx="86" cy="28" r="1.7" fill="#ffffff"/>
    </svg>

    <h1>Daniel Rotmeister</h1>
    <div class="nav-bar">
      {% include nav.html %}
    </div>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
