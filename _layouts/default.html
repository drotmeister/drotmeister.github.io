<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      font-size: 16px;
      color: #222;
    }

    /* Faixa única cinza escuro (quase preto) cobrindo nome e seções */
    header {
      position: relative;
      background-color: #222222;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px 20px;
      margin-bottom: 40px;
    }

    /* Grupos dos diagramas de Dynkin nas laterais */
    .dynkin-group {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0.88;
    }

    .dynkin-left {
      left: 28px;
    }

    .dynkin-right {
      right: 28px;
    }

    /* Esconde em telas menores para não sobrepor o nome ou o menu */
    @media (max-width: 880px) {
      .dynkin-group {
        display: none;
      }
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #ffffff;
      border-bottom: none !important;
    }

    /* Links das seções dentro da mesma faixa escura */
    .nav-bar a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 18px;
      display: inline-block;
      font-size: 1.05em;
      font-weight: normal !important;
      border-bottom: none !important;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Conteúdo principal mantido em 800px centralizado */
    main {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    main a {
      color: #8b0000;
      text-decoration: none;
    }

    main a:hover {
      text-decoration: underline;
    }

    h1, h2 {
      border-bottom: none !important;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>
<body>

  <header>
    <!-- Esquerda: An e Bn -->
    <div class="dynkin-group dynkin-left">
      <!-- Diagrama An -->
      <svg width="190" height="20" viewBox="0 0 150 24" xmlns="http://www.w3.org/2000/svg" aria-label="Dynkin diagram An">
        <circle cx="10" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="14.5" y1="12" x2="35.5" y2="12" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="40" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="58" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="68" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="78" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="96" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="100.5" y1="12" x2="129.5" y2="12" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="134" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </svg>

      <!-- Diagrama Bn -->
      <svg width="190" height="20" viewBox="0 0 150 24" xmlns="http://www.w3.org/2000/svg" aria-label="Dynkin diagram Bn">
        <circle cx="10" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="14.5" y1="12" x2="35.5" y2="12" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="40" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="58" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="68" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="78" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="96" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="100" y1="10" x2="130" y2="10" stroke="#ffffff" stroke-width="1.6"/>
        <line x1="100" y1="14" x2="130" y2="14" stroke="#ffffff" stroke-width="1.6"/>
        <polyline points="111,6.5 119,12 111,17.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="134" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </svg>
    </div>

    <h1>Daniel Rotmeister</h1>
    <div class="nav-bar">
      {% include nav.html %}
    </div>

    <!-- Direita: Cn e Dn -->
    <div class="dynkin-group dynkin-right">
      <!-- Diagrama Cn -->
      <svg width="190" height="20" viewBox="0 0 150 24" xmlns="http://www.w3.org/2000/svg" aria-label="Dynkin diagram Cn">
        <circle cx="10" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="14.5" y1="12" x2="35.5" y2="12" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="40" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="58" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="68" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="78" cy="12" r="1.5" fill="#ffffff"/>
        <circle cx="96" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="100" y1="10" x2="130" y2="10" stroke="#ffffff" stroke-width="1.6"/>
        <line x1="100" y1="14" x2="130" y2="14" stroke="#ffffff" stroke-width="1.6"/>
        <polyline points="119,6.5 111,12 119,17.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="134" cy="12" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </svg>

      <!-- Diagrama Dn -->
      <svg width="190" height="35" viewBox="0 0 150 44" xmlns="http://www.w3.org/2000/svg" aria-label="Dynkin diagram Dn">
        <circle cx="10" cy="22" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="14.5" y1="22" x2="35.5" y2="22" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="40" cy="22" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="58" cy="22" r="1.5" fill="#ffffff"/>
        <circle cx="68" cy="22" r="1.5" fill="#ffffff"/>
        <circle cx="78" cy="22" r="1.5" fill="#ffffff"/>
        <circle cx="96" cy="22" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="100.16" y1="20.29" x2="125.84" y2="9.71" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="100.16" y1="23.71" x2="125.84" y2="34.29" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="130" cy="8" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="130" cy="36" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </svg>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
