<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      font-size: 16px;
    }

    /* Faixa superior de ponta a ponta */
    header {
      background-color: #175c68;
      color: #ffffff;
      text-align: center;
      padding: 45px 20px 25px;
      margin-bottom: 40px;
    }

    header h1 {
      margin: 0;
      font-size: 2.3rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #ffffff;
      border-bottom: none !important;
    }

    header p {
      margin: 8px 0 28px;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 300;
    }

    /* Links das seções (nav.html) */
    header a {
      margin: 0 15px;
      display: inline-block;
      font-size: 1.05em;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      border-bottom: none !important;
      font-weight: normal !important;
      transition: opacity 0.2s;
    }

    header a:hover {
      opacity: 0.75;
      text-decoration: underline;
    }

    /* Conteúdo principal centralizado em 800px */
    main {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    a {
      color: #0366d6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    h1, h2 {
      border-bottom: none !important;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async 
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>
<body>

  <header>
    <h1>Daniel Rotmeister</h1>
    <p>Differential Geometry and Geometric Analysis</p>
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
